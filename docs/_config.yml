title: secretbae
description: A lightweight secret manager for a single Linux host.
remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme

color_scheme: dark

url: https://sachya.github.io
baseurl: /secretbae

aux_links:
  "GitHub":
    - "https://github.com/sachya/secretbae"

nav_external_links:
  - title: CHANGELOG
    url: https://github.com/sachya/secretbae/blob/master/CHANGELOG.md
    opens_in_new_tab: true
  - title: Report a vulnerability
    url: https://github.com/sachya/secretbae/security/advisories/new
    opens_in_new_tab: true

search_enabled: true
heading_anchors: true

footer_content: "secretbae is dual-licensed under MIT or Apache-2.0, at your option."

callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue
