# cargo-deny configuration for secretbae
# Documentation: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
]

[advisories]
version = 2
# Vulnerabilities are always denied; this section only tunes the informational categories.
unmaintained = "workspace"
yanked = "warn"

[licenses]
version = 2
# A dependency whose license isn't in `allow` below is always denied.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
# Multiple versions of the same crate treated as warnings
multiple-versions = "warn"
wildcards = "allow"

[sources]
# Deny crates from unknown package registries or git repositories
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
